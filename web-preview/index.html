<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>星途商城 · 小程序视觉预览</title>
<style>
:root{
  --brand:#ff6a00;--brand-deep:#f05500;--brand-light:#ff8a3d;--brand-bg:#fff3ea;
  --g-brand:linear-gradient(135deg,#ff8a3d,#ff6a00 60%,#f05500);
  --wx:#07c160;--g-wx:linear-gradient(135deg,#06ad56,#2cd17c);
  --danger:#ff4d4f;--price:#ff5000;--warn:#ff9500;--ok:#07b96b;
  --text:#222;--text2:#555;--muted:#999;--line:#eee;--bg:#f5f5f5;
  --sh:0 2px 8px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(900px 420px at 85% -10%,rgba(255,106,0,.18),transparent 60%),#e9ebf0;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 64px;color:var(--text);}
.preview-head{text-align:center;margin-bottom:22px;}
.logo-row{display:inline-flex;align-items:center;gap:12px;}
.logo-img{width:44px;height:44px;border-radius:12px;box-shadow:0 8px 20px rgba(255,106,0,.4);}
.preview-head h1{font-size:24px;font-weight:800;letter-spacing:1px;}
.preview-head p{color:#8a8f9c;font-size:13px;margin-top:7px;}
.page-tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;justify-content:center;}
.page-tab{padding:8px 20px;border-radius:20px;background:#fff;color:#666;font-size:13px;cursor:pointer;border:1px solid #e3e5ea;box-shadow:var(--sh);transition:all .18s;}
.page-tab.active{background:var(--g-brand);color:#fff;font-weight:700;border-color:transparent;box-shadow:0 8px 20px rgba(255,106,0,.35);}
.stage{display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap;justify-content:center;}
.phone{width:390px;border-radius:46px;background:#1d1d22;padding:12px;box-shadow:0 34px 90px rgba(40,40,60,.4),0 0 0 2px #34343c;}
.phone-screen{width:100%;height:780px;border-radius:36px;overflow:hidden;background:var(--bg);position:relative;}
.phone-notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:128px;height:25px;background:#101014;border-radius:16px;z-index:80;}
.screen{height:100%;overflow-y:auto;position:relative;background:var(--bg);padding-bottom:70px;}
.screen::-webkit-scrollbar{display:none;}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;z-index:70;}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#999;cursor:pointer;}
.tab-icon{font-size:19px;filter:grayscale(1);opacity:.75;}
.tab-item.on{color:var(--brand);font-weight:700;}
.tab-item.on .tab-icon{filter:none;opacity:1;}
.card{background:#fff;border-radius:8px;box-shadow:var(--sh);}
.price{color:var(--price);font-weight:800;}
.price-old{color:#b0b0b0;text-decoration:line-through;font-size:11px;margin-left:6px;font-weight:400;}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:22px;font-size:14px;padding:0 20px;height:40px;line-height:38px;border:none;cursor:pointer;}
.btn-primary{background:var(--g-brand);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(255,106,0,.28);}
.btn-ghost{background:#fff;color:var(--brand);border:1px solid var(--brand);}
.btn-danger{background:#fff;color:var(--danger);border:1px solid var(--danger);}
.btn-mini{height:28px;line-height:26px;font-size:12px;padding:0 14px;border-radius:14px;}
.btn[disabled]{opacity:.55;}
.status-tag{font-size:11px;padding:3px 10px;border-radius:4px;font-weight:500;}
.st-unpaid,.st-paid{background:var(--brand-bg);color:var(--brand);}
.st-shipped{background:#e9f7ef;color:var(--ok);}
.st-completed{background:#f2f2f2;color:#777;}
.st-refunded{background:#fdeef0;color:var(--danger);}
.st-cancelled{background:#f2f2f2;color:#999;}
.empty{padding:90px 30px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;font-size:13px;}
.empty-icon{font-size:56px;margin-bottom:14px;}
.loading-more{text-align:center;color:var(--muted);font-size:12px;padding:14px 0 22px;}
.ellipsis2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
/* 首页 */
.header{background:#fff;padding:10px 12px;position:sticky;top:0;z-index:10;}
.search-bar{width:100%;height:36px;background:var(--bg);border-radius:20px;display:flex;align-items:center;padding:0 14px;}
.search-icon{font-size:14px;margin-right:6px;color:#999;}
.search-input{flex:1;height:100%;border:none;background:transparent;font-size:13px;color:#333;outline:none;}
.search-input::placeholder{color:#b0b0b0;}
.cat-nav{width:100%;background:#fff;white-space:nowrap;padding:6px 0 10px;}
.cat-list{display:inline-flex;padding:0 12px;}
.cat-item{flex-shrink:0;height:30px;line-height:30px;padding:0 16px;margin-right:10px;border-radius:15px;background:#f2f2f2;color:#555;font-size:13px;cursor:pointer;}
.cat-item:last-child{margin-right:0;}
.cat-item.active{background:var(--brand);color:#fff;font-weight:600;}
.goods-grid{display:flex;flex-wrap:wrap;justify-content:space-between;padding:10px 12px;}
.goods-card{width:calc((100% - 10px)/2);background:#fff;border-radius:8px;box-shadow:var(--sh);overflow:hidden;margin-bottom:10px;cursor:pointer;transition:transform .12s;}
.goods-card:active{transform:scale(.98);}
.goods-thumb{width:100%;aspect-ratio:1/1;background:#f7f7f7;}
.goods-img{width:100%;height:100%;display:block;object-fit:cover;}
.goods-info{padding:8px;}
.goods-title{font-size:13px;font-weight:600;color:#222;line-height:1.4;height:36px;}
.goods-bottom{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px;}
.goods-price{color:var(--price);font-size:16px;font-weight:800;}
.goods-sales{color:#999;font-size:11px;}
/* 详情 */
.gallery{width:100%;aspect-ratio:1/1;background:#fff;position:relative;}
.gallery img{width:100%;height:100%;object-fit:cover;}
.gallery-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px;}
.gallery-dots i{width:6px;height:6px;border-radius:3px;background:rgba(0,0,0,.2);}
.gallery-dots i.on{width:16px;background:var(--brand);}
.d-card{margin:10px 12px 0;padding:14px;background:#fff;border-radius:8px;box-shadow:var(--sh);}
.price-row{display:flex;align-items:baseline;}
.main-price{font-size:28px;font-weight:800;}
.d-sales{margin-left:auto;font-size:12px;color:var(--muted);}
.d-title{font-size:17px;font-weight:700;line-height:1.45;margin-top:8px;}
.d-sub{font-size:12px;color:var(--muted);margin-top:5px;}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.tag{font-size:11px;color:var(--brand);background:var(--brand-bg);border-radius:4px;padding:3px 8px;}
.service{display:flex;flex-wrap:wrap;gap:6px 14px;}
.service span{font-size:12px;color:var(--ok);}
.sec-title{font-size:15px;font-weight:700;margin-bottom:12px;}
.sku-row{display:flex;flex-wrap:wrap;gap:9px;}
.sku-item{padding:7px 16px;border:1px solid #e8e8e8;border-radius:6px;font-size:13px;color:var(--text2);background:#fafafa;cursor:pointer;}
.sku-item.on{border-color:var(--brand);color:var(--brand);background:var(--brand-bg);font-weight:600;}
.sku-stock{margin-top:10px;font-size:12px;color:var(--muted);}
.qty-row{display:flex;align-items:center;justify-content:space-between;}
.qty-row .sec-title{margin-bottom:0;}
.stepper{display:flex;align-items:center;gap:4px;}
.step-btn{width:26px;height:26px;line-height:22px;text-align:center;border:1px solid #e3e3e3;border-radius:6px;font-size:15px;color:var(--text2);background:#fff;cursor:pointer;}
.step-btn.plus{color:var(--brand);border-color:var(--brand);background:var(--brand-bg);}
.step-num{width:34px;text-align:center;font-weight:700;font-size:14px;}
.spec-row{display:flex;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
.spec-row:last-child{border-bottom:none;}
.spec-label{width:90px;color:var(--muted);flex-shrink:0;}
.spec-value{flex:1;color:var(--text2);}
.action-bar{position:absolute;left:0;right:0;bottom:64px;height:56px;background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.06);display:flex;align-items:center;padding:0 12px;gap:12px;z-index:60;}
.action-cart{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--text2);width:48px;cursor:pointer;}
.action-cart b{font-size:20px;font-weight:400;}
.action-buy{flex:1;height:40px;}
/* 客服 */
.chat-top{background:var(--g-brand);padding:42px 14px 14px;display:flex;align-items:center;justify-content:space-between;}
.chat-brand{display:flex;align-items:center;color:#fff;font-size:16px;font-weight:700;}
.chat-logo{width:30px;height:30px;border-radius:8px;margin-right:8px;background:#fff;}
.chat-logo img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
.chat-top-actions{display:flex;gap:7px;}
.new-btn{font-size:11px;color:#fff;border:1px solid rgba(255,255,255,.7);border-radius:14px;padding:3px 10px;cursor:pointer;}
.msg-list{padding:14px;}
.msg-row{display:flex;align-items:flex-start;margin-bottom:16px;}
.msg-user{flex-direction:row-reverse;}
.msg-avatar{width:36px;height:36px;border-radius:8px;flex-shrink:0;background:#fff;}
.msg-bubble{max-width:74%;margin-left:9px;padding:10px 13px;background:#fff;border-radius:4px 12px 12px 12px;box-shadow:var(--sh);font-size:13px;line-height:1.6;}
.msg-user .msg-bubble{margin-left:0;margin-right:9px;background:var(--g-brand);color:#fff;border-radius:12px 4px 12px 12px;}
.card-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.msg-card{width:47%;background:var(--brand-bg);border:1px solid #ffd9bf;border-radius:6px;padding:7px 9px;cursor:pointer;}
.msg-card .t{font-size:11px;line-height:1.4;color:var(--text2);}
.msg-card .p{font-size:14px;font-weight:800;color:var(--price);margin-top:4px;}
.cite-row{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line);font-size:10px;color:var(--muted);}
.cite-tag{color:var(--brand);background:var(--brand-bg);border-radius:4px;padding:1px 6px;margin-right:5px;}
.human-hint{margin-top:6px;font-size:11px;color:var(--brand);}
.typing{display:flex;gap:5px;align-items:center;padding:12px 13px;}
.typing i{width:7px;height:7px;border-radius:50%;background:#ccc;animation:blink 1.2s infinite;}
.typing i:nth-child(2){animation-delay:.2s;}.typing i:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.3;}40%{opacity:1;}}
.input-bar{position:absolute;left:0;right:0;bottom:64px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;box-shadow:0 -2px 8px rgba(0,0,0,.05);z-index:60;}
.chat-input{flex:1;height:36px;background:var(--bg);border-radius:18px;padding:0 14px;font-size:13px;border:none;outline:none;}
.send-btn{height:36px;line-height:36px;padding:0 20px;border-radius:18px;background:var(--g-brand);color:#fff;font-size:13px;font-weight:600;cursor:pointer;}
/* 订单 */
.order-list{padding:10px 12px;}
.order-card{background:#fff;border-radius:8px;box-shadow:var(--sh);margin-bottom:10px;overflow:hidden;}
.order-head{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--line);}
.order-id{font-size:12px;color:var(--muted);}
.order-goods{padding:11px 13px;}
.goods-line{display:flex;justify-content:space-between;align-items:flex-start;padding:4px 0;}
.goods-name{flex:1;font-size:13px;line-height:1.45;margin-right:10px;}
.goods-meta{font-size:12px;color:var(--muted);white-space:nowrap;}
.track-row{display:flex;align-items:center;background:#f7faf8;border-radius:6px;padding:8px 11px;margin:0 13px 8px;font-size:11px;color:var(--ok);}
.order-foot{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-top:1px solid var(--line);}
.order-amount{font-size:12px;color:var(--text2);}
.order-amount .price{font-size:18px;margin:0 3px;}
.order-time{display:block;font-size:10px;color:var(--muted);margin-top:3px;}
.order-actions{display:flex;gap:7px;}
/* 我的 */
.user-hero{background:var(--g-brand);padding:46px 22px 34px;border-radius:0 0 22px 22px;display:flex;align-items:center;}
.user-avatar{width:62px;height:62px;border-radius:18px;overflow:hidden;border:2px solid rgba(255,255,255,.6);background:#fff;flex-shrink:0;}
.user-avatar img{width:100%;height:100%;object-fit:cover;}
.user-meta{margin-left:16px;}
.user-name{color:#fff;font-size:20px;font-weight:800;}
.user-role{display:inline-block;margin-top:6px;font-size:10px;color:var(--brand);background:#fff;border-radius:5px;padding:2px 9px;font-weight:600;}
.menu{margin:12px;background:#fff;border-radius:8px;box-shadow:var(--sh);padding:0 14px;}
.menu-item{display:flex;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.menu-item:last-child{border-bottom:none;}
.menu-icon{font-size:19px;width:30px;}
.menu-text{flex:1;font-size:14px;color:var(--text);margin-left:6px;}
.menu-arrow{color:#ccc;font-size:18px;}
.logout-btn{width:calc(100% - 24px);margin:6px 12px 0;height:44px;line-height:42px;text-align:center;color:var(--danger);border:1px solid var(--danger);border-radius:22px;font-size:14px;font-weight:700;background:#fff;cursor:pointer;}
.foot-tip{text-align:center;font-size:10px;color:var(--muted);margin-top:22px;}
/* 说明 */
.tips{max-width:330px;color:#6b7080;font-size:13px;line-height:1.95;}
.tips b{color:#222;}
.tips .img-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.tips .img-list img{width:72px;height:72px;border-radius:8px;object-fit:cover;border:2px solid #fff;box-shadow:var(--sh);}
</style>
</head>
<body>
<div class="preview-head">
  <div class="logo-row">
    <img class="logo-img" src="images/logo.jpg" alt="" />
    <h1>星途商城 · 小程序视觉预览</h1>
  </div>
  <p>极简橙主题 · 与小程序代码 1:1 同步 ｜ 主色 #ff6a00</p>
</div>
<div class="page-tabs">
  <div class="page-tab active" data-p="home">🏠 首页</div>
  <div class="page-tab" data-p="detail">🛍 详情</div>
  <div class="page-tab" data-p="chat">🤖 AI客服</div>
  <div class="page-tab" data-p="orders">📦 订单</div>
  <div class="page-tab" data-p="mine">👤 我的</div>
</div>
<div class="stage">
  <div class="phone">
    <div class="phone-screen">
      <div class="phone-notch"></div>
      <div id="home" class="screen"></div>
      <div id="detail" class="screen" style="display:none"></div>
      <div id="chat" class="screen" style="display:none"></div>
      <div id="orders" class="screen" style="display:none"></div>
      <div id="mine" class="screen" style="display:none"></div>
      <div class="tabbar">
        <div class="tab-item on" data-tab="home"><span class="tab-icon">🏠</span>首页</div>
        <div class="tab-item" data-tab="cart"><span class="tab-icon">🛒</span>购物车</div>
        <div class="tab-item" data-tab="chat"><span class="tab-icon">🤖</span>客服</div>
        <div class="tab-item" data-tab="orders"><span class="tab-icon">📦</span>订单</div>
        <div class="tab-item" data-tab="mine"><span class="tab-icon">👤</span>我的</div>
      </div>
    </div>
  </div>
  <div class="tips">
    <p>🎨 设计语言：<b>极简橙</b>（#ff6a00）+ 浅灰底（#f5f5f5），参考主流电商 App。</p>
    <p>🧱 与小程序 <b>WXML/WXSS 1:1</b>：搜索胶囊、横滑分类、双列网格、卡片 8px 圆角淡阴影。</p>
    <p>🔧 关键修复：原工程只启用 TS 编译插件、未启用 less，所有 <code>.less</code> 均未生效；已全部改为原生 <b>WXSS</b>。</p>
    <p>🖼 13 张真实商品白底图 + 实景图，图文对应。</p>
    <div class="img-list">
      <img src="images/P10009.jpg"/><img src="images/P10016.jpg"/><img src="images/P10017.jpg"/>
      <img src="images/P10020.jpg"/><img src="images/P10021.jpg"/><img src="images/logo.jpg"/>
    </div>
  </div>
</div>
<script>
/* ===== 数据（与小程序 /shop/products 一致） ===== */
const IMG = {};
for (let i = 10009; i <= 10021; i++) IMG['P' + i] = `images/P${i}.jpg`;
const SCENES = [1,2,3,4,5,6].map(i => `images/detail-scene-${i}.jpg`);
const CATEGORIES = [
  { code: '', name: '全部' },
  { code: 'post', name: '柱头灯' },
  { code: 'wall', name: '户外壁灯' },
  { code: 'garden', name: '庭院灯' },
  { code: 'solar', name: '太阳能' },
];
const SAMPLE = [
  { product_id:'P10009', title:'太阳能柱头灯户外防水现代简约LED庭院灯福字方形围墙灯后现代', category_code:'post', price:350, original_price:399, sales_count:4100 },
  { product_id:'P10010', title:'太阳能柱头灯中式庭院灯户外防水别墅大门围墙灯不锈钢景观灯新中式', category_code:'post', price:150, original_price:0, sales_count:860 },
  { product_id:'P10011', title:'太阳能柱头灯户外庭院中式别墅围墙立柱灯自动开关智能光控新中式', category_code:'post', price:110, original_price:0, sales_count:640 },
  { product_id:'P10012', title:'中式复古柱头灯户外防水LED庭院灯菱形格栅装饰灯新中式', category_code:'post', price:125, original_price:0, sales_count:520 },
  { product_id:'P10013', title:'太阳能柱头灯户外庭院别墅围墙立柱灯中式复古门柱灯新中式', category_code:'post', price:88, original_price:0, sales_count:390 },
  { product_id:'P10014', title:'中式太阳能柱头灯LED户外庭院灯山水装饰照明灯具新中式', category_code:'post', price:135, original_price:0, sales_count:300 },
  { product_id:'P10015', title:'中式复古柱头灯别墅庭院围墙灯户外防水太阳能柱子灯新中式', category_code:'post', price:120, original_price:0, sales_count:260 },
  { product_id:'P10016', title:'太阳能柱头灯户外防水别墅庭院灯中式围墙门柱氛围景观灯后现代', category_code:'solar', price:180, original_price:220, sales_count:12600 },
  { product_id:'P10017', title:'现代简约LED壁灯户外防水IP65玻璃灯罩壁挂灯具3000K-4000K', category_code:'wall', price:100, original_price:0, sales_count:1820 },
  { product_id:'P10018', title:'中式古典柱头灯方形福字装饰庭院围墙灯太阳能户外灯具', category_code:'post', price:160, original_price:199, sales_count:150 },
  { product_id:'P10019', title:'中式LED壁挂式户外壁灯玻璃灯罩铝材防水庭院灯具2700K-3000K', category_code:'wall', price:105, original_price:0, sales_count:120 },
  { product_id:'P10020', title:'太阳能壁灯户外防水别墅庭院门口灯人体感应壁灯', category_code:'wall', price:145, original_price:0, sales_count:860 },
  { product_id:'P10021', title:'新中式太阳能柱头灯户外庭院灯别墅围墙灯景观灯', category_code:'post', price:168, original_price:208, sales_count:720 },
];
const fmt = n => Number(n).toFixed(2);
function formatSales(n){ return n >= 10000 ? (n/10000).toFixed(1).replace(/\.0$/,'') + '万' : String(n||0); }

let GOODS = SAMPLE.map(g => ({ ...g, cover: IMG[g.product_id], sales_text: formatSales(g.sales_count) }));
let activeCategory = '', keyword = '', detailId = 'P10009';

function filtered(){
  return GOODS.filter(g => {
    const okCat = !activeCategory || g.category_code === activeCategory;
    const okKw = !keyword || g.title.includes(keyword);
    return okCat && okKw;
  });
}

/* ===== 首页 ===== */
function renderHome(){
  const list = filtered();
  document.getElementById('home').innerHTML = `
    <div class="header">
      <div class="search-bar">
        <span class="search-icon">🔍</span>

  kw.onkeydown = e=>{ if(e.key==='Enter'){ keyword = kw.value.trim(); renderHome(); } };

/* ===== 详情 ===== */
let detailIdx = 0, qtyN = 1, galleryTimer = null;
function openDetail(id){ detailId = id; detailIdx = 0; qtyN = 1; switchPage('detail'); }
function galleryFor(pid){
  const start = (pid.charCodeAt(5) || 0) % SCENES.length;
  return [IMG[pid], SCENES[start%6], SCENES[(start+1)%6], SCENES[(start+2)%6]];
}
function renderDetail(){

  document.getElementById('detail').innerHTML = `
    <div class="gallery">
      <img id="gMain" src="${gallery[0]}" />
      <div class="gallery-dots" id="gDots">${gallery.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>
    </div>
    <div class="d-card">
      <div class="price-row">
        <span class="main-price price">¥${fmt(g.price)}</span>
        ${g.original_price>g.price?`<span class="price-old">¥${fmt(g.original_price)}</span>`:''}
        <span class="d-sales">已售 ${g.sales_text}</span>
      </div>
      <div class="d-title">${g.title}</div>
      <div class="d-sub">星途户外照明 · IP65 防水 · 顺丰发货</div>
      <div class="tag-row"><span class="tag">IP65防水</span><span class="tag">全国包邮</span><span class="tag">1年质保</span></div>
    </div>

      <span>✓ 7天无理由</span><span>✓ 全国包邮</span><span>✓ 1年质保</span><span>✓ 48h发货</span>
    </div>
    <div class="d-card">
      <div class="sec-title">选择规格</div>
      <div class="sku-row" id="skuRow">
        <span class="sku-item on">默认规格</span><span class="sku-item">暖光 3000K</span><span class="sku-item">白光 4000K</span>
      </div>
      <div class="sku-stock">库存：充足</div>
    </div>
    <div class="d-card qty-row">
      <div class="sec-title">购买数量</div>
      <div class="stepper"><span class="step-btn" id="minus">−</span><span class="step-num" id="qnum">1</span><span class="step-btn plus" id="plus">＋</span></div>
    </div>
    <div class="d-card">
      <div class="sec-title">规格参数</div>
      <div class="spec-row"><span class="spec-label">品牌</span><span class="spec-value">星途 XINGTU</span></div>
      <div class="spec-row"><span class="spec-label">材质</span><span class="spec-value">不锈钢 / 压铸铝 + 钢化玻璃</span></div>
      <div class="spec-row"><span class="spec-label">光源</span><span class="spec-value">LED 暖光 3000K（可选 4000K）</span></div>
      <div class="spec-row"><span class="spec-label">防护等级</span><span class="spec-value">IP65 防水防雷</span></div>
      <div class="spec-row"><span class="spec-label">供电方式</span><span class="spec-value">太阳能光控 / 接电可选</span></div>
    </div>
    <div style="height:80px"></div>
    <div class="action-bar">
      <div class="action-cart" onclick="switchPage('chat')"><b>🤖</b>客服</div>
      <div class="action-cart" onclick="switchPage('home')"><b>🏠</b>店铺</div>
      <button class="btn btn-ghost" style="width:110px" onclick="goCartHint()">加入购物车</button>
      <button class="btn btn-primary action-buy">立即购买</button>
    </div>`;
  // 轮播
  clearInterval(galleryTimer);
  galleryTimer = setInterval(()=>{
    if(document.getElementById('detail').style.display==='none') return;
    detailIdx = (detailIdx+1) % gallery.length;
    document.getElementById('gMain').src = gallery[detailIdx];
    document.querySelectorAll('#gDots i').forEach((d,i)=>d.classList.toggle('on',i===detailIdx));
  }, 3000);
  document.querySelectorAll('#skuRow .sku-item').forEach(el=>el.onclick=()=>{
    document.querySelectorAll('#skuRow .sku-item').forEach(x=>x.classList.remove('on')); el.classList.add('on');
  });
  document.getElementById('minus').onclick=()=>{ qtyN=Math.max(1,qtyN-1); document.getElementById('qnum').textContent=qtyN; };
  document.getElementById('plus').onclick=()=>{ qtyN++; document.getElementById('qnum').textContent=qtyN; };
}

/* ===== 轻提示 ===== */
let toastTimer = null;
function cartToast(){
  let t = document.getElementById('floatToast');
  if (!t){
    t = document.createElement('div');
    t.id = 'floatToast';
    t.style.cssText = 'position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);color:#fff;font-size:13px;padding:10px 18px;border-radius:10px;z-index:99;pointer-events:none;';
    document.querySelector('.phone-screen').appendChild(t);
  }
  t.textContent = '购物车页见小程序（本地购物车）';
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; }, 1400);
}

/* ===== 页面切换 ===== */
function switchPage(p){
  if (p === 'cart'){ cartToast(); return; }
  document.querySelectorAll('.page-tab').forEach(x=>x.classList.toggle('active', x.dataset.p===p));
  document.querySelectorAll('.tab-item').forEach(x=>x.classList.toggle('on', x.dataset.tab===p));
  ['home','detail','chat','orders','mine'].forEach(id=>{
    document.getElementById(id).style.display = id===p ? 'block' : 'none';
  });
  if (p==='detail') renderDetail();
  if (p==='orders') renderOrders();
  if (p==='mine') renderMine();
  if (p==='chat') renderChat();
  document.getElementById(p).scrollTop = 0;
}
document.querySelectorAll('.page-tab').forEach(el=>el.onclick=()=>switchPage(el.dataset.p));
document.querySelectorAll('.tab-item').forEach(el=>el.onclick=()=>switchPage(el.dataset.tab));

/* ===== 启动（优先真实接口，失败用内置数据） ===== */
function boot(list){
  if (list && list.length){
    const mapped = list.map(it=>({
      product_id: it.product_id, title: it.title, category_code: it.category_code || it.category || '',
      price: Number(it.price), original_price: Number(it.original_price||0), sales_count: it.sales_count||0,
    })).filter(g=>IMG[g.product_id]);
    if (mapped.length){
      GOODS = mapped.map(g=>({ ...g, cover: IMG[g.product_id], sales_text: formatSales(g.sales_count) }));
    }
  }
  renderHome(); renderDetail(); renderChat(); renderOrders(); renderMine();
}
fetch('http://localhost:8000/api/v1/shop/products?size=20')
  .then(r=>r.json()).then(d=>boot(d.items)).catch(()=>boot());
